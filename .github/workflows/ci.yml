name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: Evaluate the keyword baseline
        run: uv run python scripts/evaluate.py --min-accuracy 0.70

      # Replays recorded responses: no model server, no API key, no cost.
      # Exit code 2 means the prompt, tools or model changed and the recording
      # must be regenerated locally with --record.
      - name: Evaluate the local LLM (replayed)
        run: >-
          uv run python scripts/evaluate.py --llm ollama
          --replay eval_results/recordings/qwen3-8b.json --min-accuracy 0.95

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag apply-agent:ci .

      - name: Smoke test
        run: |
          docker run --detach --name app --publish 8000:8000 \
            --env APPLY_AGENT_API_TOKEN=ci-token \
            --env APPLY_AGENT_INITIAL_LOOKBACK_DAYS=3650 \
            apply-agent:ci
          for _ in $(seq 30); do
            curl --silent --fail http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8000/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8000/applications)" = 401
          curl --silent --fail --header "Authorization: Bearer ci-token" \
            http://127.0.0.1:8000/applications?format=json

      - name: Container logs
        if: always()
        run: docker logs app || true
