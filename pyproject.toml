[project]
name = "apply-agent"
version = "0.1.0"
description = "An LLM agent that tracks job applications by reading an email inbox (read-only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added milestone by milestone, only when first used.
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "langchain-anthropic>=1.7.4",
    "langgraph>=1.2.12",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0.36,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "S",        # bandit (security)
    "DTZ",      # no naive datetimes
    "T20",      # no print()
    "PT",       # pytest style
    "PTH",      # pathlib over os.path
    "ERA",      # no commented-out code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

# Untyped third-party packages. Each one is imported in a single module that
# exposes a typed interface to the rest of the code.
[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

# google-auth ships type hints but leaves some Credentials methods unannotated.
[[tool.mypy.overrides]]
module = ["apply_agent.providers.gmail_auth"]
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
