# Your profile, used to rank job offers by fit (D59). Copy it to
# ~/.config/apply_agent/profile.toml (or set APPLY_AGENT_PROFILE_PATH) and
# edit it. It is personal: keep it out of the repository.
#
# Words match whole words, ignoring case, accents and punctuation:
# "back end" matches "Back-End", and "ia" does not match "Ingeniería".
# Alerts carry a title, a company and a place, so that is all this can see.

# Years of professional experience, for titles that match no area below.
years_experience = 2
# The most years a posting may ask for before it ranks low. Titles are read
# as: junior 0, mid 2, senior 5, lead / staff / architect 7.
max_years_asked = 4
# What a title with no seniority word ("Data Engineer") is assumed to ask.
unstated_years_asked = 2

# Roles, skills and topics you want in a title.
target = ["data engineer", "backend", "python", "analytics engineer"]

# Words that make a title a poor fit, whatever else it says.
avoid = ["devops", "sre", "frontend", "front end", "phd", "freelance"]

# The kinds of job you do (D70). A title naming none ranks low; leave it out
# to judge every title.
roles = ["engineer", "developer", "software", "machine learning", "ml"]

# Places that make an offer better. Anywhere else is neutral.
preferred_places = ["lisbon", "porto", "portugal"]

# Words in a title or company name worth a little extra.
bonus = ["climate", "energy"]

# Languages you can work in (D69). A job asking for another, or written in one,
# drops to poor fit. Empty: languages are not judged.
languages = ["english", "portuguese"]

# Experience per area (D60): a title is judged against the years in its area,
# not the total, and a title naming several areas uses the lowest. Keep these
# tables at the end: in TOML, every key after a [table] header belongs to it.
[areas.data]
years = 2
words = ["data engineer", "analytics engineer", "etl", "sql"]

[areas.ml]
years = 0
words = ["ml", "machine learning", "ai", "data scientist"]
